models:
  - name: dim_accounts
    columns:
      - name: account_id
        tests:
          - not_null
          - unique:
              config:
                where: "is_current = true"

  - name: dim_customers
    columns:
      - name: customer_id
        tests:
          - not_null
          - unique:
              config:
                where: "is_current = true"

  - name: stg_transactions
    columns:
      - name: transaction_type
        tests:
          - accepted_values:
              values: ['DEPOSIT', 'WITHDRAWAL', 'TRANSFER']
      - name: amount
        tests:
          - not_null